; FrameForge
[frameforge]
; 1..4 (1 = sin generacion / pass-through)
multiplier=2
; 0 = sin escalado, 1 = FSR1 (EASU+RCAS), 2 = bilineal
upscale=1
; 0 = ajustar a pantalla, 1 = 1.5x, 2 = 2x, 3 = 3x
scale=0
; nitidez RCAS 0..1
sharpness=0.500
; divisor de resolucion del flujo optico 1..4
flow_downscale=2
; permitir tearing (VRR) si el sistema lo soporta
vrr=1
; 0 nada, 1 flujo, 2 oclusion, 3 HUD
debug_view=0
hud_mask=1
hud_frames=3
; 0 = espanol, 1 = english
language=0
